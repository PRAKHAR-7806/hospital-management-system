spring.application.name=hms
spring.profiles.active=local
server.port=${PORT:8080}
# Database: when deployed, these come from environment variables (Phase 6).
# On your PC, application-local.properties overrides them.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hospital_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
# The SQL scripts own the schema, so Hibernate must not change it
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
# Used only on your own computer (profile "local"). Never committed to Git.
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_db?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=PUT_YOUR_MYSQL_ROOT_PASSWORD_HERE